[package]
name = "ai-app-router"
version = "0.1.0"
edition = "2024"
authors = ["Oliver Kiessler <kiessler@inceedo.com>"]
description = "Map natural-language tasks to configured CLI, webapp, or API tools"
license = "MIT"
repository = "https://github.com/okiess/ai-app-router"
homepage = "https://github.com/okiess/ai-app-router"
documentation = "https://github.com/okiess/ai-app-router/blob/main/README.md"
keywords = ["cli", "agent", "tools", "router", "ai"]
categories = ["command-line-utilities"]
rust-version = "1.85"

[[bin]]
name = "aiar"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
comfy-table = "8"
dirs = "6"
serde = { version = "1", features = ["derive"] }
strsim = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "0.9"
serde_json = "1"
dialoguer = "0.12"
