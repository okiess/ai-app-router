[package]
name = "ai-app-router"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "aiar"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
dirs = "5"
serde = { version = "1", features = ["derive"] }
strsim = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "0.8"
serde_json = "1"
